# Reusable governance gate workflow
# Adopters use this instead of vendoring governance_check.py (187KB)
#
# Usage in adopter repo (.github/workflows/governance.yml):
#   jobs:
#     governance:
#       uses: wellmanifest/new-project/.github/workflows/governance-gate-reusable.yml@v0.20.32
#       with:
#         target-root: .
name: governance-gate

on:
  workflow_call:
    inputs:
      target-root:
        description: "Root directory of the governed repository"
        required: false
        default: "."
        type: string
      python-version:
        description: "Python version to use"
        required: false
        default: "3.12"
        type: string

jobs:
  governance-check:
    name: governance / deterministic gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out governed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Resolve standard version
        id: version
        shell: bash
        env:
          GOVERNANCE_ROOT: ${{ inputs.target-root }}
        run: |
          set -euo pipefail
          standard_version="$(python3 - <<'PY_VERSION'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ['GOVERNANCE_ROOT']) / '.governance/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['standard']['id'] != 'wellmanifest/new-project':
              raise SystemExit('Unsupported standard identity')
          print(manifest['standard']['version'])
          PY_VERSION
          )"
          [[ "$standard_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "standard=$standard_version" >> "$GITHUB_OUTPUT"
          echo "Resolved standard version: $standard_version"

      - name: Install governance runtime
        run: |
          set -euo pipefail
          runtime_ref="v${{ steps.version.outputs.standard }}"
          python3 -m pip install "git+https://github.com/wellmanifest/new-project.git@${runtime_ref}#subdirectory=packages/wellman"

      - name: Run governance gate
        shell: bash
        env:
          GOVERNANCE_ROOT: ${{ inputs.target-root }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range_arguments=()
          if [[ -n "${BASE_SHA:-}" || -n "${HEAD_SHA:-}" ]]; then
            if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
              echo "Both BASE_SHA and HEAD_SHA are required for PR validation." >&2
              exit 1
            fi
            range_arguments=(--base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          python -m wellman check \
            --root "$GOVERNANCE_ROOT" \
            --actor ci "${range_arguments[@]}"

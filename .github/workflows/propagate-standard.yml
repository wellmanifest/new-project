# Automatically create upgrade PRs in all adopter repositories
# when a new wellmanifest/new-project release is published.
#
# This ensures all 100+ adopting repos receive the latest standard
# within 24 hours of a release.
name: propagate-standard

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target-version:
        description: "Version to propagate (e.g. 0.20.33)"
        required: true
        type: string
      dry-run:
        description: "Only list affected repos without creating PRs"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  discover-adopters:
    name: Discover adopting repositories
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.scan.outputs.repos }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and revision
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          else
            VERSION="${{ inputs.target-version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          REVISION=$(git rev-parse "v${VERSION}" 2>/dev/null || git rev-parse HEAD)
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "Propagating standard v${VERSION} at ${REVISION}"

      - name: Scan org repos for governance adopters
        id: scan
        env:
          GH_TOKEN: ${{ secrets.ORG_GOVERNANCE_TOKEN }}
        run: |
          # An unset secret made every scan return zero adopters and the
          # upgrade matrix then failed on an empty list; fail with the cause.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::ORG_GOVERNANCE_TOKEN is not configured; cannot list adopter repositories."
            exit 1
          fi
          # Search across all orgs for repos adopting this standard
          REPOS="[]"
          for ORG in semcod subactor autogrammar wellmanifest maskservice; do
            if ! FOUND=$(gh repo list "$ORG" --json nameWithOwner --limit 200 --jq '.[].nameWithOwner'); then
              echo "::error::Cannot list repositories of ${ORG} with ORG_GOVERNANCE_TOKEN."
              exit 1
            fi
            for REPO in $FOUND; do
              # Check if repo has governance manifest
              HAS_LOCK=$(gh api "repos/${REPO}/contents/.governance/manifest.lock.json" --jq '.content' 2>/dev/null || echo "")
              if [ -n "$HAS_LOCK" ]; then
                REPOS=$(echo "$REPOS" | python3 -c "import sys,json; r=json.load(sys.stdin); r.append('$REPO'); print(json.dumps(r))")
              fi
            done
          done
          echo "repos=$REPOS" >> $GITHUB_OUTPUT
          echo "Found $(echo $REPOS | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))') adopting repositories"

  create-upgrade-prs:
    name: Upgrade ${{ matrix.repo }}
    needs: discover-adopters
    if: ${{ (github.event_name == 'release' || !inputs.dry-run) && needs.discover-adopters.outputs.repos != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.discover-adopters.outputs.repos) }}
    steps:
      - name: Check out adopter repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.ORG_GOVERNANCE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upgrade tools
        run: pip install wellman goal

      - name: Run standard upgrade
        run: |
          goal governance adopt \
            --upgrade \
            --source-revision ${{ needs.discover-adopters.outputs.revision }}

      - name: Create upgrade PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ORG_GOVERNANCE_TOKEN }}
          commit-message: "chore: adopt wellmanifest standard ${{ needs.discover-adopters.outputs.version }}"
          title: "chore: upgrade wellmanifest standard to ${{ needs.discover-adopters.outputs.version }}"
          body: |
            ## Automatic standard upgrade

            Wellmanifest/new-project **${{ needs.discover-adopters.outputs.version }}** has been released.

            This PR upgrades governance managed files to match the new standard.

            ### What changed
            See [release notes](https://github.com/wellmanifest/new-project/releases/tag/v${{ needs.discover-adopters.outputs.version }}).

            ---
            _Auto-generated by [propagate-standard](https://github.com/wellmanifest/new-project/actions/workflows/propagate-standard.yml)_
          branch: governance/upgrade-${{ needs.discover-adopters.outputs.version }}
          labels: governance,automated

{
  "name": "propagate-standard",
  "on": {
    "release": {
      "types": [
        "published"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "target-version": {
          "description": "Published canonical version (for example 0.20.103)",
          "required": true,
          "type": "string"
        },
        "dry-run": {
          "description": "Emit advisory request only; live execution is unavailable",
          "required": true,
          "default": true,
          "type": "boolean"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "advisory-request": {
      "name": "Verify release and emit advisory request",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Emit immutable source facts; no adopter execution",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "GH_TOKEN": "${{ github.token }}",
            "PYTHONDONTWRITEBYTECODE": "1"
          },
          "run": "mkdir -p .subactor/receipts\npython3 -B scripts/standard_propagation_request.py --event-name \"$EVENT_NAME\" --event-path \"$GITHUB_EVENT_PATH\" > .subactor/receipts/standard-propagation-request.json"
        },
        {
          "name": "Upload advisory request; does not authorize execution",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "standard-propagation-request",
            "path": ".subactor/receipts/standard-propagation-request.json",
            "if-no-files-found": "error",
            "retention-days": 14,
            "include-hidden-files": true
          }
        }
      ]
    }
  }
}

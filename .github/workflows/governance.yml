name: reusable-governance

on:
  workflow_call:
    inputs:
      standard-ref:
        description: Immutable wellmanifest/new-project commit SHA used by the caller
        required: true
        type: string
      manifest:
        description: Target-repository governance manifest
        required: false
        default: .governance/manifest.json
        type: string
      lock:
        description: Target-repository governance lock
        required: false
        default: .governance/manifest.lock.json
        type: string
      trusted-reviewers:
        description: Comma-separated GitHub user logins authorized to approve governance changes
        required: false
        default: ''
        type: string
      trusted-validator-apps:
        description: Comma-separated exact GitHub App bot logins, including the [bot] suffix
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    name: governance / enforce
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate immutable standard reference
        shell: bash
        env:
          STANDARD_REF: ${{ inputs.standard-ref }}
        run: |
          if [[ ! "$STANDARD_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "standard-ref must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
      - name: Check out pinned governance standard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wellmanifest/new-project
          ref: ${{ inputs.standard-ref }}
          path: .new-project-standard
          persist-credentials: false
      - name: Exclude workflow-owned standard checkout from target diff
        shell: bash
        run: printf '%s\n' '/.new-project-standard/' >> .git/info/exclude
      - name: Acquire GitHub branch lifecycle snapshot
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          BRANCH_LIFECYCLE_SNAPSHOT: ${{ runner.temp }}/new-project-branch-lifecycle.json
        with:
          script: |
            const fs = require('fs');
            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const repositorySettings = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  deleteBranchOnMerge
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const snapshot = {
              schema: 'new-project.branch-lifecycle-snapshot/v1',
              repository: `${context.repo.owner}/${context.repo.repo}`,
              defaultBranch: repository.data.default_branch,
              deleteBranchOnMerge: repositorySettings.repository.deleteBranchOnMerge,
              branches: branches.map(branch => branch.name).sort(),
              openPullRequests: pulls.map(pull => ({
                number: pull.number,
                headRepository: pull.head.repo?.full_name ?? null,
                headRef: pull.head.ref,
              })).sort((left, right) => left.number - right.number),
            };
            fs.writeFileSync(
              process.env.BRANCH_LIFECYCLE_SNAPSHOT,
              `${JSON.stringify(snapshot)}\n`,
              {encoding: 'utf8', mode: 0o600},
            );
      - name: Validate GitHub branch lifecycle
        shell: bash
        env:
          BRANCH_LIFECYCLE_SNAPSHOT: ${{ runner.temp }}/new-project-branch-lifecycle.json
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .new-project-standard/scripts/branch_lifecycle_check.py \
            --snapshot "$BRANCH_LIFECYCLE_SNAPSHOT" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --format text
      - name: Resolve ticket owning the pull request diff
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RESOLVED_TICKET_PATH: ${{ runner.temp }}/new-project-resolved-ticket.txt
        run: |
          python3 .new-project-standard/scripts/governance_check.py \
            --root . \
            --manifest "${{ inputs.manifest }}" \
            --lock "${{ inputs.lock }}" \
            --stack-profiles .new-project-standard/governance/stack-profiles.json \
            --base "$BASE_SHA" \
            --head "$EXPECTED_HEAD" \
            --actor ci \
            --resolved-ticket-output "$RESOLVED_TICKET_PATH" \
            --format text
      - name: Resolve trusted human or Validator App approval
        id: approval
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TRUSTED_REVIEWERS: ${{ inputs.trusted-reviewers }}
          TRUSTED_VALIDATOR_APPS: ${{ inputs.trusted-validator-apps }}
          APPROVAL_EVIDENCE_PATH: ${{ runner.temp }}/new-project-approval-evidence.json
          RESOLVED_TICKET_PATH: ${{ runner.temp }}/new-project-resolved-ticket.txt
        with:
          script: |
            const fs = require('fs');
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const normalize = value => value.trim().toLowerCase();
            const parseAuthorities = (raw, label) => {
              const values = raw.split(',').map(normalize).filter(Boolean);
              if (values.some(value => !/^[a-z0-9][a-z0-9-]*(?:\[bot\])?$/.test(value))) {
                throw new Error(`${label} contains an invalid GitHub login`);
              }
              return new Set(values);
            };
            const trustedReviewers = parseAuthorities(
              process.env.TRUSTED_REVIEWERS ?? '', 'trusted-reviewers');
            const trustedValidatorApps = parseAuthorities(
              process.env.TRUSTED_VALIDATOR_APPS ?? '', 'trusted-validator-apps');
            if ([...trustedReviewers].some(login => login.endsWith('[bot]'))) {
              throw new Error('trusted-reviewers must contain User logins, not Bot logins');
            }
            if ([...trustedValidatorApps].some(login => !login.endsWith('[bot]'))) {
              throw new Error('trusted-validator-apps entries must include the [bot] suffix');
            }
            if (trustedReviewers.size + trustedValidatorApps.size === 0) {
              throw new Error('configure at least one trusted reviewer or Validator App');
            }
            const latest = new Map();
            for (const review of reviews) latest.set(normalize(review.user.login), review);
            const author = normalize(context.payload.pull_request.user.login);
            const head = context.payload.pull_request.head.sha;
            const currentApprovals = [...latest.values()].filter(review =>
              review.state === 'APPROVED' && review.commit_id === head
              && normalize(review.user.login) !== author);
            const humanApproval = currentApprovals.find(review =>
              review.user.type === 'User'
              && trustedReviewers.has(normalize(review.user.login)));
            const appApproval = currentApprovals.find(review =>
              review.user.type === 'Bot'
              && trustedValidatorApps.has(normalize(review.user.login)));
            const approved = humanApproval ?? appApproval;
            const ticket = fs.existsSync(process.env.RESOLVED_TICKET_PATH)
              ? fs.readFileSync(process.env.RESOLVED_TICKET_PATH, 'utf8').trim() : '';
            if (ticket && !/^ticket-[0-9]{3}$/.test(ticket)) {
              throw new Error('resolved ticket output is malformed');
            }
            if (!approved || !ticket) {
              core.setOutput('source', 'none');
              core.setOutput('ticket', ticket || 'none');
              return;
            }
            const source = approved.user.type === 'Bot'
              ? 'github-app-review' : 'github-review';
            const evidence = {
              schema: 'new-project.approval-evidence/v1',
              source,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              pullRequest: context.payload.pull_request.number,
              headSha: head,
              ticket,
              actor: {login: approved.user.login, type: approved.user.type},
              verification: {method: 'github-api-allowlist', verified: true},
            };
            fs.writeFileSync(process.env.APPROVAL_EVIDENCE_PATH, `${JSON.stringify(evidence)}\n`, {
              encoding: 'utf8', mode: 0o600,
            });
            core.setOutput('source', source);
            core.setOutput('ticket', ticket);
      - name: Validate policy, intent, scope and approval
        shell: bash
        env:
          APPROVAL_EVIDENCE_PATH: ${{ runner.temp }}/new-project-approval-evidence.json
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_PULL_REQUEST: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(
            --root .
            --manifest "${{ inputs.manifest }}"
            --lock "${{ inputs.lock }}"
            --stack-profiles .new-project-standard/governance/stack-profiles.json
            --actor ci
            --format text
          )
          if [[ "${{ github.event_name }}" == pull_request || "${{ github.event_name }}" == pull_request_review ]]; then
            args+=(--base "$BASE_SHA" --enforce-approval \
              --head "$EXPECTED_HEAD" \
              --expected-repository "$EXPECTED_REPOSITORY" \
              --expected-pull-request "$EXPECTED_PULL_REQUEST" \
              --expected-head "$EXPECTED_HEAD")
            if [[ -f "$APPROVAL_EVIDENCE_PATH" ]]; then
              args+=(--approval-evidence "$APPROVAL_EVIDENCE_PATH")
            fi
          fi
          python3 .new-project-standard/scripts/governance_check.py "${args[@]}"

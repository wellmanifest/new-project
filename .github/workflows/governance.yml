name: reusable-governance

on:
  workflow_call:
    inputs:
      standard-ref:
        description: Immutable wellmanifest/new-project commit SHA used by the caller
        required: true
        type: string
      manifest:
        description: Target-repository governance manifest
        required: false
        default: .governance/manifest.json
        type: string
      lock:
        description: Target-repository governance lock
        required: false
        default: .governance/manifest.lock.json
        type: string
      trusted-reviewers:
        description: Comma-separated GitHub user logins authorized to approve governance changes
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    name: governance / enforce
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate immutable standard reference
        shell: bash
        env:
          STANDARD_REF: ${{ inputs.standard-ref }}
        run: |
          if [[ ! "$STANDARD_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "standard-ref must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
      - name: Check out pinned governance standard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wellmanifest/new-project
          ref: ${{ inputs.standard-ref }}
          path: .new-project-standard
          persist-credentials: false
      - name: Resolve independent human approval
        id: approval
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TRUSTED_REVIEWERS: ${{ inputs.trusted-reviewers }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const latest = new Map();
            for (const review of reviews) latest.set(review.user.login, review);
            const author = context.payload.pull_request.user.login;
            const head = context.payload.pull_request.head.sha;
            const trustedReviewers = new Set((process.env.TRUSTED_REVIEWERS ?? '')
              .split(',').map(value => value.trim()).filter(Boolean));
            if (trustedReviewers.size === 0) {
              core.setFailed('trusted-reviewers must identify at least one authorized GitHub user');
              return;
            }
            const approved = [...latest.values()].some(review =>
              review.state === 'APPROVED' && review.commit_id === head
              && review.user.login !== author && review.user.type === 'User'
              && trustedReviewers.has(review.user.login));
            const ticketRoot = 'project';
            const active = fs.readdirSync(ticketRoot, {withFileTypes: true})
              .filter(item => item.isDirectory() && /^ticket-[0-9]{3}$/.test(item.name))
              .filter(item => {
                const readme = fs.readFileSync(path.join(ticketRoot, item.name, 'README.md'), 'utf8');
                return /^-\s+\*\*Status\*\*:\s*IN_PROGRESS\s*$/mi.test(readme);
              }).map(item => item.name);
            core.setOutput('source', approved ? 'github-review' : 'none');
            core.setOutput('ticket', active.length > 0 ? active.sort().join(',') : 'none');
      - name: Validate policy, intent, scope and approval
        shell: bash
        env:
          APPROVAL_SOURCE: ${{ steps.approval.outputs.source }}
          APPROVED_TICKET: ${{ steps.approval.outputs.ticket }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(
            --root .
            --manifest "${{ inputs.manifest }}"
            --lock "${{ inputs.lock }}"
            --stack-profiles .new-project-standard/governance/stack-profiles.json
            --actor ci
            --format text
          )
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            args+=(--base "$BASE_SHA" --enforce-approval --approval-source "$APPROVAL_SOURCE" --approved-ticket "$APPROVED_TICKET")
          fi
          python3 .new-project-standard/scripts/governance_check.py "${args[@]}"

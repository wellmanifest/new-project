name: governance-standard-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Validate JSON contracts
        run: |
          python3 -m json.tool governance/manifest.schema.json >/dev/null
          python3 -m json.tool governance/manifest.default.json >/dev/null
          python3 -m json.tool governance/intent.schema.json >/dev/null
          python3 -m json.tool governance/lock.schema.json >/dev/null
          python3 -m json.tool governance/diagnostics.json >/dev/null
          python3 -m json.tool governance/stack-profiles.json >/dev/null
          python3 -m json.tool governance/package-manifest.json >/dev/null
      - name: Test ticket governance scripts
        run: bash tests/governance-scripts.test.sh
      - name: Test deterministic governance validator
        run: bash tests/governance-validator.test.sh
      - name: Test deterministic branch lifecycle validator
        run: bash tests/branch-lifecycle.test.sh
      - name: Test immutable adoption lock
        run: bash tests/adoption-lock.test.sh

  windows-governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Test Windows governance entrypoints
        shell: pwsh
        run: ./tests/windows-governance.test.ps1 -SourceRevision $env:GITHUB_SHA

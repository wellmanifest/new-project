name: governance-standard-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Validate JSON contracts
        run: |
          python3 -m json.tool governance/manifest.schema.json >/dev/null
          python3 -m json.tool governance/manifest.default.json >/dev/null
          python3 -m json.tool governance/intent.schema.json >/dev/null
          python3 -m json.tool governance/lock.schema.json >/dev/null
          python3 -m json.tool governance/diagnostics.json >/dev/null
          python3 -m json.tool governance/stack-profiles.json >/dev/null
          python3 -m json.tool governance/package-manifest.json >/dev/null
          python3 -m json.tool governance/required-checks.json >/dev/null
          python3 -m json.tool governance/decision-record.schema.json >/dev/null
      - name: Assert required check names match workflow jobs
        run: python3 scripts/check_required_checks.py
      - name: Test required-checks gate
        run: bash tests/required-checks.test.sh
      - name: Test decision-record replay and append-only
        run: bash tests/decision-record.test.sh
      - name: Test ticket governance scripts
        run: bash tests/governance-scripts.test.sh
      - name: Test deterministic governance validator
        run: bash tests/governance-validator.test.sh
      - name: Test deterministic branch lifecycle validator
        run: bash tests/branch-lifecycle.test.sh
      - name: Test governance environment runtime
        run: bash tests/governance-env.test.sh
      - name: Test immutable adoption lock
        run: bash tests/adoption-lock.test.sh
      # Every tests/*.test.sh must be listed above. The list is hand-written, so
      # this refuses to pass when a suite exists that no step runs - which is how
      # governance-env.test.sh went unexecuted after ticket 020 added it.
      - name: Assert every test suite is wired into this workflow
        run: |
          set -euo pipefail
          missing=0
          for suite in tests/*.test.sh; do
            if ! grep -Fq "bash $suite" .github/workflows/ci.yml; then
              echo "CI does not run $suite" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

  windows-governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Test Windows governance entrypoints
        shell: pwsh
        run: ./tests/windows-governance.test.ps1 -SourceRevision $env:GITHUB_SHA

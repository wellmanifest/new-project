name: governance-standard-ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Acquire live GitHub branch lifecycle snapshot
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BRANCH_LIFECYCLE_SNAPSHOT: ${{ runner.temp }}/new-project-branch-lifecycle.json
        with:
          script: |
            const fs = require('fs');
            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const settings = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  deleteBranchOnMerge
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const snapshot = {
              schema: 'new-project.branch-lifecycle-snapshot/v1',
              repository: `${context.repo.owner}/${context.repo.repo}`,
              defaultBranch: repository.data.default_branch,
              deleteBranchOnMerge: settings.repository.deleteBranchOnMerge,
              branches: branches.map(branch => branch.name).sort(),
              openPullRequests: pulls.map(pull => ({
                number: pull.number,
                headRepository: pull.head.repo?.full_name ?? null,
                headRef: pull.head.ref,
              })).sort((left, right) => left.number - right.number),
            };
            fs.writeFileSync(
              process.env.BRANCH_LIFECYCLE_SNAPSHOT,
              `${JSON.stringify(snapshot)}\n`,
              {encoding: 'utf8', mode: 0o600},
            );
      - name: Validate live GitHub branch lifecycle
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          BRANCH_LIFECYCLE_SNAPSHOT: ${{ runner.temp }}/new-project-branch-lifecycle.json
        run: |
          python3 scripts/branch_lifecycle_check.py \
            --snapshot "$BRANCH_LIFECYCLE_SNAPSHOT" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --format text
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Validate JSON contracts
        run: |
          python3 -m json.tool governance/manifest.schema.json >/dev/null
          python3 -m json.tool governance/manifest.default.json >/dev/null
          python3 -m json.tool governance/manifest.hub.json >/dev/null
          python3 -m json.tool governance/intent.schema.json >/dev/null
          python3 -m json.tool governance/lock.schema.json >/dev/null
          python3 -m json.tool governance/diagnostics.json >/dev/null
          python3 -m json.tool governance/stack-profiles.json >/dev/null
          python3 -m json.tool governance/package-manifest.json >/dev/null
          python3 -m json.tool governance/required-checks.json >/dev/null
          python3 -m json.tool governance/decision-record.schema.json >/dev/null
      - name: Validate Governance Hub pull-request scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/governance_check.py \
            --root . \
            --manifest governance/manifest.hub.json \
            --stack-profiles governance/stack-profiles.json \
            --work-classification governance/work-classification.dsl.json \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --actor ci \
            --format text
      - name: Assert required check names match workflow jobs
        run: python3 scripts/check_required_checks.py
      - name: Test required-checks gate
        run: bash tests/required-checks.test.sh
      - name: Test decision-record replay and append-only
        run: bash tests/decision-record.test.sh
      - name: Test ticket governance scripts
        run: bash tests/governance-scripts.test.sh
      - name: Test terminal receipt activity resolver
        run: bash tests/ticket-activity.test.sh
      - name: Test deterministic governance validator
        run: bash tests/governance-validator.test.sh
      - name: Test deterministic branch lifecycle validator
        run: bash tests/branch-lifecycle.test.sh
      - name: Test local workspace lifecycle validator
        run: bash tests/workspace-lifecycle.test.sh
      - name: Test governance environment runtime
        run: bash tests/governance-env.test.sh
      - name: Test immutable adoption lock
        run: bash tests/adoption-lock.test.sh
      - name: Test automatic pre-commit standard update preparation
        run: bash tests/precommit-standard-update.test.sh
      - name: Test receipt-aware ticket activity resolution
        run: bash tests/ticket-activity.test.sh
      - name: Test work continuity checkpoint and resume contract
        run: bash tests/work-continuity.test.sh
      # Every tests/*.test.sh must be listed above. The list is hand-written, so
      # this refuses to pass when a suite exists that no step runs - which is how
      # governance-env.test.sh went unexecuted after ticket 020 added it.
      - name: Test rule-enforcement traceability
        run: bash tests/rule-enforcement.test.sh
      - name: Test host-agnostic LLM instruction contract
        run: bash tests/agent-hosts.test.sh
      - name: Test pytest governance lifecycle plugin
        run: bash tests/pytest-plugin.test.sh
      - name: Test proactive worktree overlap guard
        run: bash tests/worktree-overlap.test.sh
      - name: Test fleet drift report
        run: bash tests/fleet-report.test.sh
      - name: Assert every test suite is wired into this workflow
        run: |
          set -euo pipefail
          missing=0
          for suite in tests/*.test.sh; do
            if ! grep -Fq "bash $suite" .github/workflows/ci.yml; then
              echo "CI does not run $suite" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

  windows-governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test Windows governance entrypoints
        shell: pwsh
        run: ./tests/windows-governance.test.ps1 -SourceRevision $env:GITHUB_SHA

# Publish wellman package to PyPI via trusted publishing (OIDC)
# Triggered on tag push or manual dispatch
name: wellman-publish

on:
  push:
    tags:
      - "wellman-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.20.32)"
        required: true

jobs:
  publish:
    name: Build and publish wellman to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build wellman package
        working-directory: packages/wellman
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/wellman/dist/
          skip-existing: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/wellman/dist/*
          generate_release_notes: true

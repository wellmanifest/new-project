# Publish wellman package to PyPI
# Triggered on tag push or manual dispatch from the packages/wellman directory
name: wellman-publish

on:
  push:
    tags:
      - "wellman-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.20.32)"
        required: true

jobs:
  publish:
    name: Build and publish wellman to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wellman package
        working-directory: packages/wellman
        run: uv build

      - name: Publish to PyPI
        working-directory: packages/wellman
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/wellman/dist/*
          generate_release_notes: true

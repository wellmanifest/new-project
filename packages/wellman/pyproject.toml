[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wellmanifest-governance"
version = "0.20.120"
description = "Wellmanifest governance gate runtime — deterministic policy-as-code checker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "wellmanifest"}]
keywords = ["governance", "policy-as-code", "wellmanifest", "standard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
wellman-governance = "wellmanifest_governance_runtime.check:main"

[tool.setuptools]
packages = ["wellmanifest_governance_runtime", "wellmanifest_governance_runtime._bundled"]
package-dir = {"wellmanifest_governance_runtime" = "src/wellman"}

[tool.setuptools.package-data]
wellmanifest_governance_runtime = ["_bundled/*.py", "_bundled/*.json"]
